<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>WeAreParty — Natural Connection</title>

  <meta
    name="description"
    content="WeAreParty conecta personas, DJs y espacios a través de la música. Una comunidad construida alrededor del talento, la identidad y las experiencias reales."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =========================================================
       WEAREPARTY
       Natural Connection
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #060606;
      --surface: #0b0b0c;
      --surface-2: #101011;

      --white: #ffffff;
      --text: rgba(255,255,255,.88);
      --muted: rgba(255,255,255,.45);
      --faint: rgba(255,255,255,.20);

      --cyan: #00c8ff;
      --violet: #7b2cff;
      --magenta: #e8005a;

      --border: rgba(255,255,255,.08);

      --max: 1440px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(var(--max), calc(100% - 80px));
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .gradient-text {
      background: linear-gradient(
        90deg,
        var(--cyan),
        var(--violet),
        var(--magenta)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .pulse-line {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 2px;

      z-index: 1000;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--violet),
          var(--magenta)
        );
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    nav {
      position: relative;
      z-index: 20;

      width: 100%;
      padding: 26px 40px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);

      background: rgba(6,6,6,.65);
      backdrop-filter: blur(14px);
    }

    .logo img {
      height: 38px;
      width: auto;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;

      color: var(--muted);

      transition: color .25s ease;
    }

    .nav-links a:hover {
      color: var(--white);
    }

    .nav-button {
      padding: 10px 18px;

      border: 1px solid rgba(0,200,255,.45);

      color: var(--cyan);

      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;

      transition: all .25s ease;
    }

    .nav-button:hover {
      background: rgba(0,200,255,.08);
      border-color: var(--cyan);
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;

      min-height: calc(100vh - 91px);

      display: flex;
      align-items: center;

      overflow: hidden;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .glow-1 {
      position: absolute;

      width: 700px;
      height: 700px;

      right: -200px;
      top: 0;

      background:
        radial-gradient(
          circle,
          rgba(123,44,255,.17),
          transparent 68%
        );

      filter: blur(20px);
    }

    .glow-2 {
      position: absolute;

      width: 600px;
      height: 600px;

      left: -300px;
      bottom: -200px;

      background:
        radial-gradient(
          circle,
          rgba(0,200,255,.10),
          transparent 68%
        );

      filter: blur(20px);
    }

    .hero-grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 80px 80px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );
    }

    .hero-content {
      position: relative;
      z-index: 2;

      padding: 100px 0 120px;

      max-width: 950px;
    }

    .hero-eyebrow {
      margin-bottom: 30px;
    }

    .hero-title {
      font-size: clamp(58px, 9vw, 132px);

      line-height: .90;
      letter-spacing: -.065em;

      font-weight: 600;

      max-width: 1000px;
    }

    .hero-title span {
      display: block;
    }

    .hero-description {
      max-width: 570px;

      margin-top: 42px;

      font-size: 16px;
      line-height: 1.8;

      color: var(--muted);
    }

    .hero-actions {
      display: flex;
      gap: 12px;

      margin-top: 42px;
    }

    .button-primary,
    .button-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 14px 22px;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: .15em;
      text-transform: uppercase;

      transition: all .25s ease;
    }

    .button-primary {
      color: #050505;
      background: var(--white);
    }

    .button-primary:hover {
      background: var(--cyan);
    }

    .button-secondary {
      border: 1px solid var(--border);
      color: var(--text);
    }

    .button-secondary:hover {
      border-color: rgba(255,255,255,.3);
    }

    .live-indicator {
      position: absolute;

      right: 40px;
      bottom: 70px;

      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 9px;
      letter-spacing: .15em;
      text-transform: uppercase;

      color: var(--muted);
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--magenta);

      box-shadow:
        0 0 15px rgba(232,0,90,.7);

      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {

      0%,100% {
        opacity: .4;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }

    }

    /* =========================================================
       MANIFIESTO
    ========================================================= */

    .manifesto {

      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);

      padding: 110px 0;
    }

    .manifesto-grid {

      display: grid;

      grid-template-columns: 1fr 2fr;

      gap: 80px;
    }

    .manifesto-label {
      padding-top: 10px;
    }

    .manifesto-text {

      font-size: clamp(30px, 4vw, 58px);

      line-height: 1.15;

      letter-spacing: -.035em;

      color: rgba(255,255,255,.82);
    }

    .manifesto-text strong {

      color: var(--white);

      font-weight: 500;
    }

    /* =========================================================
       ECOSYSTEM
    ========================================================= */

    .ecosystem {
      padding: 110px 0;
    }

    .section-top {

      display: flex;

      justify-content: space-between;
      align-items: flex-end;

      margin-bottom: 50px;
    }

    .section-heading {

      font-size: clamp(34px, 5vw, 62px);

      letter-spacing: -.045em;

      line-height: 1;

      font-weight: 500;
    }

    .section-intro {

      max-width: 350px;

      font-size: 13px;

      line-height: 1.8;

      color: var(--muted);
    }

    .ecosystem-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 1px;

      background: var(--border);

      border: 1px solid var(--border);
    }

    .ecosystem-card {

      min-height: 340px;

      padding: 36px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      background: var(--bg);

      transition:
        background .3s ease;
    }

    .ecosystem-card:hover {
      background: var(--surface);
    }

    .card-number {

      font-size: 10px;

      color: var(--faint);

      letter-spacing: .15em;
    }

    .card-title {

      font-size: 28px;

      letter-spacing: -.03em;

      margin-bottom: 16px;
    }

    .card-description {

      font-size: 13px;

      line-height: 1.8;

      color: var(--muted);

      max-width: 320px;
    }

    .card-arrow {

      font-size: 20px;

      color: var(--cyan);
    }

    /* =========================================================
       NATURAL CONNECTION
    ========================================================= */

    .connection {

      position: relative;

      overflow: hidden;

      padding: 140px 0;

      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .connection-bg {

      position: absolute;
      inset: 0;

      background:

        radial-gradient(
          ellipse at 50% 100%,
          rgba(123,44,255,.22),
          transparent 55%
        ),

        radial-gradient(
          ellipse at 15% 50%,
          rgba(0,200,255,.08),
          transparent 40%
        ),

        radial-gradient(
          ellipse at 85% 30%,
          rgba(232,0,90,.07),
          transparent 40%
        );
    }

    .connection-content {

      position: relative;

      text-align: center;
    }

    .connection-title {

      margin-top: 25px;

      font-size: clamp(50px, 9vw, 120px);

      line-height: .9;

      letter-spacing: -.065em;

      font-weight: 600;
    }

    .connection-description {

      max-width: 580px;

      margin: 38px auto 0;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.8;
    }

    .frequency {

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 3px;

      height: 50px;

      margin-top: 55px;
    }

    .frequency span {

      width: 3px;

      border-radius: 4px;

      background:
        linear-gradient(
          to top,
          var(--cyan),
          var(--violet),
          var(--magenta)
        );

      animation:
        frequency 1.8s ease-in-out infinite;
    }

    .frequency span:nth-child(1)  { height: 15px; animation-delay: .0s; }
    .frequency span:nth-child(2)  { height: 30px; animation-delay: .1s; }
    .frequency span:nth-child(3)  { height: 42px; animation-delay: .2s; }
    .frequency span:nth-child(4)  { height: 24px; animation-delay: .3s; }
    .frequency span:nth-child(5)  { height: 50px; animation-delay: .4s; }
    .frequency span:nth-child(6)  { height: 32px; animation-delay: .5s; }
    .frequency span:nth-child(7)  { height: 44px; animation-delay: .6s; }
    .frequency span:nth-child(8)  { height: 20px; animation-delay: .7s; }
    .frequency span:nth-child(9)  { height: 38px; animation-delay: .8s; }
    .frequency span:nth-child(10) { height: 48px; animation-delay: .9s; }
    .frequency span:nth-child(11) { height: 26px; animation-delay: 1s; }
    .frequency span:nth-child(12) { height: 40px; animation-delay: 1.1s; }
    .frequency span:nth-child(13) { height: 18px; animation-delay: 1.2s; }

    @keyframes frequency {

      0%,100% {
        transform: scaleY(.45);
        opacity: .4;
      }

      50% {
        transform: scaleY(1);
        opacity: .9;
      }

    }

    /* =========================================================
       SETS
    ========================================================= */

    .sets {
      padding: 110px 0;
    }

    .sets-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .sets-title {
      font-size: 32px;
      letter-spacing: -.035em;
      font-weight: 500;
    }

    .sets-link {
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .sets-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .set-card {
      background: var(--surface);
      border: 1px solid var(--border);
      transition:
        transform .25s ease,
        border-color .25s ease;
    }

    .set-card:hover {
      transform: translateY(-4px);
      border-color: rgba(123,44,255,.45);
    }

    .set-visual {
      position: relative;
      height: 210px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 28px;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 100%,
          rgba(123,44,255,.25),
          transparent 60%
        ),

        #09090d;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }

    .bars span {
      width: 4px;
      border-radius: 3px 3px 0 0;

      background:
        linear-gradient(
          to top,
          var(--cyan),
          var(--violet)
        );

      opacity: .7;
    }

    .play {
      position: absolute;
      right: 14px;
      bottom: 14px;

      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
    }

    .play::after {
      content: "";

      width: 0;
      height: 0;

      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid var(--white);

      margin-left: 2px;
    }

    .set-info {
      padding: 18px;
    }

    .set-platform {
      font-size: 9px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 8px;
    }

    .set-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .set-meta {
      font-size: 10px;
      color: var(--muted);
    }

    /* =========================================================
       EVENTS
    ========================================================= */

    .events {
      padding: 110px 0;
      border-top: 1px solid var(--border);
    }

    .event {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      align-items: center;
      gap: 35px;

      padding: 30px 0;

      border-bottom: 1px solid var(--border);
    }

    .event:first-of-type {
      border-top: 1px solid var(--border);
    }

    .event-date {
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .event-name {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .event-location {
      font-size: 11px;
      color: var(--muted);
    }

    .event-arrow {
      color: var(--muted);
      font-size: 18px;
    }

    /* =========================================================
       CTA
    ========================================================= */

    .cta {
      padding: 150px 0;
      text-align: center;
    }

    .cta-title {
      font-size: clamp(48px, 8vw, 110px);
      line-height: .95;
      letter-spacing: -.06em;
      font-weight: 500;
    }

    .cta-text {
      max-width: 560px;
      margin: 30px auto 40px;

      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      padding: 30px 40px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-top: 1px solid var(--border);
    }

    .footer-brand {
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .socials {
      display: flex;
      gap: 22px;
    }

    .socials a {
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);

      transition: color .2s ease;
    }

    .socials a:hover {
      color: var(--white);
    }

    /* =========================================================
       TABLET / MOBILE
    ========================================================= */

    @media (max-width: 900px) {

      .container {
        width: min(100% - 40px, var(--max));
      }

      nav {
        padding: 20px;
      }

      .nav-links {
        display: none;
      }

      .nav-right {
        gap: 0;
      }

      .hero {
        min-height: auto;
      }

      .hero-content {
        padding: 110px 0 130px;
      }

      .hero-title {
        font-size: clamp(52px, 16vw, 88px);
      }

      .hero-description {
        font-size: 14px;
      }

      .live-indicator {
        right: 20px;
        bottom: 30px;
      }

      .manifesto {
        padding: 80px 0;
      }

      .manifesto-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .ecosystem {
        padding: 80px 0;
      }

      .section-top {
        display: block;
      }

      .section-intro {
        margin-top: 25px;
      }

      .ecosystem-grid {
        grid-template-columns: 1fr;
      }

      .ecosystem-card {
        min-height: 280px;
      }

      .connection {
        padding: 100px 0;
      }

      .sets {
        padding: 80px 0;
      }

      .sets-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .set-visual {
        height: 160px;
      }

      .events {
        padding: 80px 0;
      }

      .event {
        grid-template-columns: 70px 1fr auto;
        gap: 15px;
      }

      .event-name {
        font-size: 16px;
      }

      .cta {
        padding: 110px 0;
      }

      footer {
        padding: 25px 20px;
        flex-direction: column;
        gap: 20px;
      }
    }

    @media (max-width: 520px) {

      .nav-button {
        padding: 9px 13px;
      }

      .hero-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .button-primary,
      .button-secondary {
        width: 100%;
      }

      .sets-grid {
        grid-template-columns: 1fr;
      }

      .set-visual {
        height: 190px;
      }

      .event {
        grid-template-columns: 1fr auto;
      }

      .event-date {
        grid-column: 1 / -1;
      }

      .event-arrow {
        grid-column: 2;
        grid-row: 2;
      }

      .socials {
        flex-wrap: wrap;
        justify-content: center;
      }
    }

  </style>
</head>

<body>

  <div class="pulse-line"></div>

  <nav>

    <a href="#" class="logo">
      <img
        src="logo.png"
        alt="WeAreParty"
      />
    </a>

    <div class="nav-right">

      <ul class="nav-links">

        <li>
          <a href="#sets">Sets</a>
        </li>

        <li>
          <a href="#eventos">Eventos</a>
        </li>

        <li>
          <a href="#ecosistema">Comunidad</a>
        </li>

        <li>
          <a href="filosofia.html">Filosofía</a>
        </li>

      </ul>

      <a
        href="mailto:contacto@weareparty.com"
        class="nav-button"
      >
        Booking
      </a>

    </div>

  </nav>

  <main>

    <section class="hero">

      <div class="hero-background">

        <div class="glow-1"></div>
